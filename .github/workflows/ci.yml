name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # vitest 4 imports `styleText` from node:util and so needs Node 20+. That is a
    # constraint on the test runner, not on the package: the published SDK supports
    # Node 18, which the `compat` job below proves against the built artifact.
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Prettier owns every file the repo does not ignore, including the markdown.
      # Without this step the only thing keeping formatting consistent is whether a
      # contributor remembered to run `npm run format`, and it drifts the moment one
      # does not.
      - run: npm run format:check

      - run: npm run typecheck

      # Unit only. The integration suite in tests/integration talks to the live
      # sandbox at https://api.oneclickdz.com, and every run discovers and pays real
      # sandbox transactions against one shared, published key. It skips rather than
      # fails when the API is unreachable, so running it here would be safe — but a
      # matrix of two Node versions on every push would spend that key's rate limit on
      # a result the suite already proves when it is run by hand. Run it with
      # `npm run test:integration`.
      - run: npm test

      - run: npm run build

      - run: npm pack --dry-run

  compat:
    # The package claims Node >=18, so prove the built artifact actually loads and
    # runs there — through both entry points, since a broken `exports` map is the
    # usual way a dual CJS/ESM build ships broken.
    name: node ${{ matrix.node }} loads the built package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: require() the built package
        run: |
          node -e "
            const sdk = require('./dist/index.cjs');
            if (typeof sdk.BillPayClient !== 'function') throw new Error('BillPayClient missing');
            if (sdk.isTerminal('UNKNOWN') !== false) throw new Error('UNKNOWN must not be terminal');
            if (sdk.newRef('x').length > 100) throw new Error('ref exceeds 100 chars');
            new sdk.BillPayClient({ apiKey: 'k' });
            console.log('CJS ok on node ' + process.version);
          "

      - name: import the built package
        run: |
          node --input-type=module -e "
            import { BillPayClient, isTerminal, newRef } from './dist/index.js';
            if (typeof BillPayClient !== 'function') throw new Error('BillPayClient missing');
            if (isTerminal('UNKNOWN') !== false) throw new Error('UNKNOWN must not be terminal');
            if (newRef('x').length > 100) throw new Error('ref exceeds 100 chars');
            new BillPayClient({ apiKey: 'k' });
            console.log('ESM ok on node ' + process.version);
          "
